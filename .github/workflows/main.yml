name: RDP

on:
  workflow_dispatch:

jobs:
  tailscale-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          # Enable RDP firewall rule
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Set RDP to allow any version (NLA off for easier connect)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0

          # Set password for runner account
          $password = "RdpPass123!"
          $username = $env:USERNAME
          net user $username $password

          Write-Host "RDP enabled for user: $username"
          Write-Host "Password set to: $password"

      - name: Install Tailscale
        shell: powershell
        run: |
          # Download Tailscale
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $tsPath = "$env:TEMP\tailscale-setup.exe"

          curl.exe -L -o $tsPath $tsUrl

          # Install silently
          Start-Process -FilePath $tsPath -ArgumentList "/S" -Wait

          Start-Sleep -Seconds 10

          Write-Host "Tailscale installed"

      - name: Connect to Tailscale
        shell: powershell
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

          # Authenticate and connect
          & $tsExe up --authkey=$env:TAILSCALE_AUTHKEY --hostname="github-rdp" --accept-routes

          Start-Sleep -Seconds 15

          # Get Tailscale IP
          $tsIP = & $tsExe ip -4

          Write-Host "==============================="
          Write-Host "TAILSCALE IP: $tsIP"
          Write-Host "RDP USERNAME: $env:USERNAME"
          Write-Host "RDP PASSWORD: RdpPass123!"
          Write-Host "Connect via RDP to: $tsIP"
          Write-Host "==============================="

          # Save IP to env
          echo "TS_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Keep alive for 6 hours then self-delete
        shell: powershell
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $startTime = Get-Date

          Write-Host "==============================="
          Write-Host "TAILSCALE IP: $env:TS_IP"
          Write-Host "RDP to $env:TS_IP port 3389"
          Write-Host "USER: $env:USERNAME"
          Write-Host "PASS: RdpPass123!"
          Write-Host "==============================="

          while (
            (New-TimeSpan `
              -Start $startTime `
              -End (Get-Date)
            ).TotalHours -lt 6
          ) {
              $tsIP = & $tsExe ip -4
              Write-Host "[$(Get-Date)] Alive - Tailscale IP: $tsIP"
              Start-Sleep -Seconds 300
          }

          Write-Host "6 hours up - logging out of Tailscale..."

          # logout removes the node from your devices list entirely
          & $tsExe logout

          Start-Sleep -Seconds 5

          Write-Host "Done - node removed from Tailscale devices"
